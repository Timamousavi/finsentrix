<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد تحلیل احساسات بازار بورس ایران</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css" rel="stylesheet">
    <link href="{{ url_for('static', path='/css/style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">تحلیل احساسات بازار بورس</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">خانه</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/dashboard">داشبورد</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <!-- Market Overview -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">وضعیت کلی بازار</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-6">
                                <div class="market-stat">
                                    <h6>شاخص کل</h6>
                                    <p id="tseIndex" class="h4">-</p>
                                    <span id="tseChange" class="change-badge">-</span>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="market-stat">
                                    <h6>شاخص هم‌وزن</h6>
                                    <p id="ifxIndex" class="h4">-</p>
                                    <span id="ifxChange" class="change-badge">-</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Trading Volume -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">حجم معاملات</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-6">
                                <div class="market-stat">
                                    <h6>حجم معاملات کل</h6>
                                    <p id="tseVolume" class="h4">-</p>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="market-stat">
                                    <h6>حجم معاملات خرد</h6>
                                    <p id="ifxVolume" class="h4">-</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Batch Analysis -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">تحلیل دسته‌ای</h5>
                    </div>
                    <div class="card-body">
                        <form id="batchAnalyzeForm">
                            <div class="mb-3">
                                <label for="batchText" class="form-label">متن‌های مورد نظر را وارد کنید (هر متن در یک خط):</label>
                                <textarea class="form-control" id="batchText" rows="6" dir="rtl" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">تحلیل دسته‌ای</button>
                        </form>

                        <div id="batchResults" class="mt-4">
                            <!-- Results will be inserted here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', path='/js/dashboard.js') }}"></script>
</body>
</html>
