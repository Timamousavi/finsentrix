<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحلیل احساسات بازار بورس ایران</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css" rel="stylesheet">
    <link href="{{ url_for('static', path='/css/style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">تحلیل احساسات بازار بورس</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="/">خانه</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">داشبورد</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">تحلیل متن مالی</h5>
                    </div>
                    <div class="card-body">
                        <form id="analyzeForm">
                            <div class="mb-3">
                                <label for="text" class="form-label">متن مورد نظر را وارد کنید:</label>
                                <textarea class="form-control" id="text" rows="4" dir="rtl" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">تحلیل</button>
                        </form>

                        <div id="result" class="mt-4" style="display: none;">
                            <h5>نتیجه تحلیل:</h5>
                            <div class="alert" id="sentimentAlert" role="alert">
                                <p class="mb-2"><strong>احساس:</strong> <span id="sentimentResult"></span></p>
                                <p class="mb-2"><strong>اطمینان:</strong> <span id="confidenceResult"></span></p>
                            </div>
                            <div class="mt-3">
                                <h6>جزئیات:</h6>
                                <ul id="detailsList" class="list-group"></ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', path='/js/main.js') }}"></script>
</body>
</html>
